```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Story</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Playfair Display', serif;
      background-color: #faf8f5;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(90%);
    }

    /* Soft overlay */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.25));
    }

    /* Romantic text */
    .hero-text {
      position: absolute;
      top: 34%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      z-index: 2;
    }

    .hero-text h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 4rem;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .hero-text p {
      font-style: italic;
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    /* Language toggle */
    .lang-toggle {
      position: absolute;
      top: 20px;
      right: 30px;
      z-index: 3;
    }

    .lang-toggle button {
      background: rgba(255,255,255,0.7);
      border: none;
      padding: 8px 14px;
      margin-left: 5px;
      border-radius: 20px;
      cursor: pointer;
      font-style: italic;
      transition: 0.3s;
    }

    .lang-toggle button:hover {
      background: #fff;
    }

    /* Floral decorations */
    .floral {
      position: absolute;
      width: 180px;
      opacity: 0.8;
      z-index: 2;
    }

    .floral.top-left {
      top: 0;
      left: 0;
    }

    .floral.bottom-right {
      bottom: 0;
      right: 0;
      transform: rotate(180deg);
    }

    /* Smooth fade-in */
    .fade-in {
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -60%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    /* Mobile */
    @media (max-width: 768px) {
      .hero-text {
        top: 30%;
      }

      .hero-text h1 {
        font-size: 2.5rem;
      }

      .hero-text p {
        font-size: 1rem;
      }

      .floral {
        width: 120px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <!-- Background -->
    <img src="your-image.jpg" alt="Couple">

    <div class="overlay"></div>

    <!-- Floral accents (use PNG with transparent background) -->
    <img src="flower1.png" class="floral top-left">
    <img src="flower2.png" class="floral bottom-right">

    <!-- Language toggle -->
    <div class="lang-toggle">
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('es')">ES</button>
    </div>

    <!-- Text -->
    <div class="hero-text fade-in">
      <h1 id="names">Alex & Jordan</h1>
      <p id="subtitle">Our story begins</p>
    </div>
  </section>

  <script>
    function setLang(lang) {
      if (lang === 'es') {
        document.getElementById('subtitle').innerText = "Nuestra historia comienza";
      } else {
        document.getElementById('subtitle').innerText = "Our story begins";
      }
    }
  </script>

</body>
</html>
```
